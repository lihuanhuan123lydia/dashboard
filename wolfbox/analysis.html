<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache">
<title>WOLFBOX 需求分析</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0d14;--bg2:#131621;--card:#1a1e2e;--hover:#24283b;--text:#e8eaf0;--t2:#8892a8;--tm:#5a6378;--accent:#3b82f6;--border:#262a3d;--sbw:175px}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track:var(--bg)::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sidebar{width:var(--sbw);min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);padding:12px 6px;flex-shrink:0;display:flex;flex-direction:column}
.sidebar .brand{font-size:.85rem;font-weight:800;padding:2px 8px 8px;border-bottom:1px solid var(--border);margin-bottom:6px}
.sidebar .brand span{background:linear-gradient(135deg,#60a5fa,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sl{font-size:.55rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--tm);padding:5px 8px 2px}
.fb{display:flex;align-items:center;gap:4px;width:100%;padding:4px 7px;border-radius:4px;cursor:pointer;font-size:.66rem;font-weight:500;color:var(--t2);background:0;border:0;text-align:left;transition:.1s;margin-bottom:1px}
.fb:hover{background:var(--hover);color:var(--text)}
.fb.act{background:rgba(59,130,246,.12);color:#93c5fd}
.fb .n{font-size:.53rem;background:rgba(255,255,255,.06);padding:0 5px;border-radius:3px;margin-left:auto;color:var(--tm)}
.fb .d{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sd{height:1px;background:var(--border);margin:4px 6px}
.main{flex:1;padding:12px 16px;overflow-y:auto;max-height:100vh}

/* Stat card */
.sc{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 10px;text-align:center}
.sc .sv{font-size:1.1rem;font-weight:700}
.sc .sl{font-size:.53rem;color:var(--tm);letter-spacing:.03em}

/* Progress bar row */
.br{display:flex;align-items:center;gap:5px;padding:2px 0;font-size:.66rem}
.bt{flex:1;height:16px;background:var(--bg);border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px;display:flex;align-items:center;padding-left:4px;font-size:.52rem;font-weight:600;color:#fff;min-width:20px;transition:width .5s}

/* Category card */
.cc{background:var(--card);border:1px solid var(--border);border-radius:7px;margin-bottom:6px;overflow:hidden}
.cc-h{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:.72rem;font-weight:600;cursor:pointer;user-select:none}
.cc-h:hover{filter:brightness(1.1)}
.cc-b{padding:4px 10px 8px}
.cc .ar{font-size:.5rem;transition:transform .2s;color:var(--tm)}
.cc.cl .ar{transform:rotate(-90deg)}
.cc.cl .cc-b{display:none}

/* Brand row */
.bg{margin-bottom:4px}
.brd{display:flex;align-items:center;gap:4px;padding:2px 4px;font-size:.62rem;font-weight:500;color:var(--t2);border-radius:3px;cursor:pointer}
.brd:hover{background:var(--hover)}
.brd .ar2{font-size:.45rem;transition:transform .15s}

/* Vehicle list with progress bars */
.bv{display:block;padding:2px 10px}
.vr{display:flex;align-items:center;gap:4px;padding:2px 0;font-size:.6rem;border-bottom:1px solid rgba(38,42,61,.15)}
.vr:last-child{border:0}
.vr .vl{width:120px;display:flex;gap:3px;flex-shrink:0;overflow:hidden}
.vr .vl .yr{color:var(--tm);font-size:.52rem}
.vr .vl .md{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vr .vl .tr{color:var(--tm);font-size:.5rem}
.vr .vbt{flex:1;height:12px;background:var(--bg);border-radius:3px;overflow:hidden}
.vr .vbf{height:100%;border-radius:3px;display:flex;align-items:center;padding-left:3px;font-size:.45rem;font-weight:600;color:#fff;min-width:14px;transition:width .4s}
.vr .vcnt{width:20px;text-align:right;font-size:.58rem;font-weight:600;color:#93c5fd}

.badge{display:inline-flex;padding:0 5px;border-radius:3px;font-size:.52rem;font-weight:600}
.b-exist{background:rgba(34,197,94,.12);color:#86efac}
.b-new{background:rgba(249,115,22,.12);color:#fdba74}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;border-radius:3px;padding:0 5px;font-size:.5rem;font-weight:700;min-width:16px;text-align:center}

/* Modal */
.mod{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center}
.mod.show{display:flex}
.mod-b{background:var(--card);border:1px solid var(--border);border-radius:8px;width:90%;max-width:480px;max-height:65vh;overflow:hidden}
.mod-h{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-size:.75rem;font-weight:600}
.mod-x{background:0;border:0;color:var(--t2);cursor:pointer;font-size:.9rem;padding:2px 5px;border-radius:3px}
.mod-x:hover{background:var(--hover);color:var(--text)}
.mod-bd{padding:6px 12px;overflow-y:auto;max-height:calc(65vh - 36px)}

.loading{padding:30px;text-align:center;color:var(--tm)}
.loading .sp{width:16px;height:16px;border:2px solid rgba(255,255,255,.08);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;margin:0 auto 4px}
@keyframes s{to{transform:rotate(360deg)}}

@media(max-width:700px){.sidebar{display:none}.main{padding:8px}}
</style>
</head>
<body>

<div class="mod" id="mod" onclick="if(event.target===this)cm()">
  <div class="mod-b">
    <div class="mod-h"><span id="modT">详情</span><button class="mod-x" onclick="cm()">✕</button></div>
    <div class="mod-bd" id="modB"></div>
  </div>
</div>

<aside class="sidebar">
  <div class="brand"><span>需求分析</span></div>
  <div style="flex:1;overflow-y:auto" id="sb"></div>
  <div class="sd"></div>
  <div class="text-[.52rem] text-gray-600 px-2 py-1">
    <div id="ut">-</div>
    <button class="text-[.52rem] text-blue-400 bg-transparent border-0 cursor-pointer hover:text-blue-300" onclick="ld()">🔄 刷新</button>
  </div>
</aside>

<div class="main" id="mainContent">
  <div class="flex items-center gap-2 mb-3 flex-wrap" id="topBar"></div>
  <div id="body"></div>
</div>


<script>
let D, af='all', vd=[], np=[], wp=['电动踏板','后侧踏','电动伸缩盖','车载摄像头','侧踏板','后视镜','灯支架','越野灯','充气泵','货架'];

// 车型名归一化：trim/版本后缀等去除，方便按基础车型聚合
function nm(m) {
  let s = (m||'').trim();
  s = s.replace(/\s*Super\s*Duty/i, '');
  s = s.replace(/\s*SuperDuty/i, '');
  s = s.replace(/\s*SuperDury/i, '');
  s = s.replace(/^Dodge\s+ram\s+/i, '');
  s = s.replace(/\s+(quad|crew|extended|regular|super|king)\s*cab\b/i, '');
  return s.trim() || m||'';
}

// 创意新品分析版块
function naSection() {
  const na = D ? (D.new_product_analysis || {}) : {};
  const trends = na.key_trends || [];
  const pains = na.pain_points || [];
  const cats = na.categories || {};
  const catEntries = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const maxCat = Math.max(1, catEntries[0]?.[1]||1);
  const clrs = ['#f97316','#a855f7','#10b981','#f59e0b','#6366f1','#3b82f6'];
  return [
    '<div class="grid grid-cols-3 gap-2 mb-3">',
      '<div class="sc"><div class="sv">'+(na.total||0)+'</div><div class="sl">新品创意</div></div>',
      '<div class="sc"><div class="sv">'+Object.keys(cats).length+'</div><div class="sl">新品类</div></div>',
      '<div class="sc"><div class="sv" style="color:#c084fc">'+(na.exclusive_count||0)+'</div><div class="sl">独家需求</div></div>',
    '</div>',
    '<div class="grid md:grid-cols-2 gap-3 mb-3">',
      '<div class="cc" style="border-color:rgba(245,158,11,.25)">',
        '<div class="cc-h" style="background:rgba(59,47,26,.5);border-bottom:1px solid rgba(245,158,11,.15)"><span>📈 需求趋势分析</span></div>',
        '<div class="cc-b">'+trends.map(function(t,ti){
          return '<div style="margin-bottom:'+(ti<trends.length-1?'8px':'')+';padding-bottom:'+(ti<trends.length-1?'6px':'')+';'+(ti<trends.length-1?'border-bottom:1px solid rgba(255,255,255,.06)':'')+'">'
            +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">'
            +'<span style="font-size:.62rem;font-weight:600;color:#fcd34d">'+t.name+'</span>'
            +'<span class="badge" style="background:rgba(245,158,11,.12);color:#fbbf24;font-size:.48rem">'+t.count+'条</span>'
            +'</div>'
            +'<div style="font-size:.6rem;color:var(--t2);line-height:1.5">'+t.desc+'</div>'
            +'</div>';
        }).join('')+'</div>',
      '</div>',
      '<div class="cc" style="border-color:rgba(251,191,36,.2)">',
        '<div class="cc-h" style="background:rgba(59,47,26,.5);border-bottom:1px solid rgba(251,191,36,.12)"><span>🎯 改装用户痛点</span></div>',
        '<div class="cc-b">'+pains.map(function(p,pi){
          return '<div style="display:flex;align-items:start;gap:5px;padding:3px 0;font-size:.6rem;border-bottom:'+(pi<pains.length-1?'1px solid rgba(255,255,255,.04)':'0')+'">'
            +'<span style="font-size:.55rem;flex-shrink:0">'+['🔴','🟠','🟡','🟢','🔵','🟣','⚪'][pi%7]+'</span>'
            +'<span style="color:var(--t2);line-height:1.5">'+p+'</span>'
            +'</div>';
        }).join('')+'</div>',
      '</div>',
    '</div>',
    '<div class="cc mb-3" style="border-color:rgba(245,158,11,.2);background:rgba(245,158,11,.02);">',
      '<div class="cc-h" style="background:rgba(59,47,26,.4);border-bottom:1px solid rgba(245,158,11,.1)"><span>📊 新品需求品类分布</span></div>',
      '<div class="cc-b">'+catEntries.map(function(e,ci){
        var c=e[0],cnt=e[1];
        var pct=(cnt/maxCat*100).toFixed(0);
        return '<div class="br"><span style="width:90px;font-size:.6rem;font-weight:500">'+c+'</span><div class="bt"><div class="bf" style="width:'+pct+'%;background:'+clrs[ci%clrs.length]+'">'+cnt+'</div></div><span style="width:20px;text-align:right;font-size:.6rem;font-weight:600">'+cnt+'</span></div>';
      }).join('')+'</div>',
    '</div>'
  ].join('\n');
}

async function ld() {
  try {
    const r = await fetch('analysis_data.json?_t='+Date.now());
    D = await r.json();
    vd = D.vehicle_data||[]; np = D.new_product_data||[];



    document.getElementById('ut').textContent = '📅 '+(D.updated_at||'-');
    rn();
  } catch(e) {
    document.getElementById('body').innerHTML = '<div class="loading"><div class="sp"></div>加载失败</div>';
  }
}

function rn() {
  const cd={}, bset=new Set();
  vd.forEach(v => {
    (v.cat||'').split('\n').forEach(c => {
      c=c.trim(); if(!c) return;
      if(!cd[c]) cd[c]={total:0, brands:{}};
      cd[c].total++;
      if(v.make) {
        bset.add(v.make);
        if(!cd[c].brands[v.make]) cd[c].brands[v.make]={count:0, vehicles:{}};
        cd[c].brands[v.make].count++;
        const mkey = nm(v.model);
        if(!cd[c].brands[v.make].vehicles[mkey]) cd[c].brands[v.make].vehicles[mkey]={count:0, model:mkey};
        cd[c].brands[v.make].vehicles[mkey].count++;
      }
    });
  });

  const cs = Object.entries(cd).sort((a,b)=>b[1].total-a[1].total);
  const cc = {'电动踏板':'#1e3a5f','后侧踏':'#3b1f3b','电动伸缩盖':'#1b4332','车载摄像头':'#3b3020'};
  const bc = ['#3b82f6','#f97316','#8b5cf6','#10b981','#ec4899','#14b8a6','#f59e0b','#6366f1'];
  const total = vd.length;
  const ds={
    '保险杠折叠踏板':'🇺🇸 NA市场AMP/GORhino竞品已成熟，可错位打竞品覆盖少的车，配合YouTube安装教程打口碑',
    '前备箱搁脚板':'🇺🇸 Cybertruck车主愿意为独特配件付溢价，尚无竞品，可抢先占位',
    '捆扎带/车尾网':'🇺🇸 低风险快赢品，NA truck owner人均必备，Home Depot/Tractor Supply走量可观',
    '全轮间自动踏板':'🇺🇸 NA lifted truck文化盛行，建议先攻F-Series/Ram 2500等lift热门车型',
    '后斗宠物仓':'🇺🇸 Dog Truck文化极强，中端价位（$200-$2000之间）后斗宠物仓有市场空白',
    '电动踏板':'🇺🇸 Hummer H2/Escalade等老款全尺寸SUV改装圈需求集中：客户愿自装支架，可卖裸板+电机+线束 DIY 套件，或在改装论坛（H2 fanatics）种草开发专用适配支架',
  };

  // Sidebar
  document.getElementById('sb').innerHTML = `
    <div class="sl">品类</div>
    <button class="fb ${af==='all'?'act':''}" onclick="sf('all')"><span class="d" style="background:#60a5fa"></span>概览<span class="n">${total}</span></button>
    ${cs.map(([c,cd2],i)=>`<button class="fb ${af===c?'act':''}" onclick="sf('${c}')"><span class="d" style="background:${cc[c]||'#555'}"></span>${c}<span class="n">${cd2.total}</span></button>`).join('')}
    <div class="sd"></div>
    <div class="sl">其他</div>
    <button class="fb ${af==='new'?'act':''}" onclick="sf('new')"><span class="d" style="background:#f59e0b"></span>创意新品<span class="n">${np.length}</span></button>
  `;

  document.getElementById('topBar').innerHTML = `
    <h1 class="text-base font-bold">📊 WOLFBOX-Gear 车型需求分析</h1>
    <span class="text-[.55rem] bg-blue-900/30 text-blue-300 px-2 py-0.5 rounded-full">${total} 条</span>
    <span class="text-[.55rem] bg-purple-900/30 text-purple-300 px-2 py-0.5 rounded-full">${cs.length} 品类</span>
    <span class="text-[.55rem] bg-green-900/30 text-green-300 px-2 py-0.5 rounded-full">${bset.size} 品牌</span>
  `;

    if (af === 'new') {
    document.getElementById('body').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 10px;background:rgba(245,158,11,.08);border-radius:6px;border:1px solid rgba(245,158,11,.2);">
      <span style="font-size:.95rem">✨</span>
      <span style="font-weight:700;font-size:.8rem;color:#fcd34d">创意新品分析</span>
      <span style="flex:1"></span>
      <span style="font-size:.58rem;color:var(--tm)">${np.length} 条 · 全部独家</span>
    </div>
    ${naSection()}
    <div class="cc"><div class="cc-h" style="background:#3b2f1a"><span class="ar">▼</span><span class="flex-1">🟡 创意新品需求</span><span class="text-[.6rem] opacity-70">${np.length} 条</span></div>
    <div class="cc-b">${np.length?np.map((p,i)=>`<div class="flex items-center gap-2 py-1.5 ${i<np.length-1?'border-b border-gray-800':''}"><span class="text-[.62rem] font-medium hover:text-amber-300 cursor-pointer" onclick="showNP(${i})">${p.title} <span class="text-[.48rem] text-gray-600">📖</span></span>${p.exclusive===true?`<span class="badge" style="background:rgba(139,92,246,.15);color:#c084fc;font-size:.48rem">🔒 独家</span>`:''}<span class="badge b-new">${p.cat}</span><span class="text-[.52rem] text-gray-600 ml-auto">${(p.detail||'').slice(0,40)}</span></div>`).join(''):'<div class="text-[.58rem] text-gray-600 py-2">暂无</div>'}</div></div>`;
    return;
  }

  // Build vehicle model ranking for card
  function renderCatCard(cat, cd2) {
    const bgc = cc[cat]||'#1e2a3a';
    // Flat list of all vehicles across brands, sorted by count desc
    const allV = [];
    Object.entries(cd2.brands).forEach(([mk,bd]) => {
      Object.values(bd.vehicles).forEach(v => {
        allV.push({make:mk, model:v.model, count:v.count});
      });
    });
    allV.sort((a,b) => b.count - a.count);
    const mv = Math.max(1, allV[0]?.count||1);
    const brandSet = new Set(allV.map(v=>v.make));

    // Collect notable customer feedback for this category
    function isNotable(d) {
      if(!d||d.length<10) return false;
      const l = d.toLowerCase();
      if(l.includes('vin')||l.includes('vin#')) return false;
      return true;
    }
    const notes = vd.filter(v => v.cat===cat && isNotable(v.detail));
    // Priority: unique/new vehicles, strong sentiment, market gap mentions
    const priority = notes.filter(n => {
      const d = (n.detail||'').toLowerCase();
      return d.includes('corner the market') || d.includes('nothing like') ||
             d.includes("don't make") || d.includes("doesn't make") ||
             d.includes('no one makes') || d.includes('you have to create') ||
             d.includes('you guys have to') || d.includes('hope you') ||
             d.includes('would love') || d.includes('love this idea') ||
             d.includes('please') || d.includes('please put your');
    });
    const important = notes.filter(n => !priority.includes(n)).slice(0,10);
    const highlights = [...priority, ...important].filter((n,i,a)=>a.findIndex(x=>x.make===n.make&&x.model===n.model)===i).slice(0,12);

    function cnDetail(d) {
      if(!d) return '';
      const m = new Map([
        [/corner the market/i, '市场空白，建议抢占先机'],
        [/nothing like( it)?(\s+for)?/i, '目前无同类产品，市场空白'],
        [/don'?t see anyone making.*for.*ranger|no one makes.*for.*ranger/i, '福特Ranger车型市场空白，无人开发'],
        [/you have to create( one)? for.*ridgeline/i, '强烈要求为Honda Ridgeline开发此产品'],
        [/you('d| guys have to) /i, '强烈建议开发，将占领市场'],
        [/love this idea/i, '非常喜欢此创新设计'],
        [/would love to try/i, '非常期待尝试使用'],
        [/please put your R.?&D/i, '恳请研发部门关注此车型'],
        [/i was surprised (not|by)/i, '惊讶发现该车型无适配产品'],
        [/can'?t find (any|it) (on|at)/i, '官网上未找到对应适配产品'],
        [/will you have this available for/i, '询问新车型是否适配'],
        [/do you make (one|this|this one)( to fit)?( for)?/i, '询问是否支持该车型'],
        [/any chance there is (a|an)/i, '询问是否有适配产品方案'],
        [/looking for( power)?( retractable)?( a)?( bed)?(.*?) for( my)?/i, '正在寻找适配产品'],
        [/hope you will( come out with)?/i, '期待品牌推出适配此车型的产品'],
        [/interested in( step)?( for)?/i, '对该产品感兴趣，询问适配性'],
        [/availability for my truck/i, '询问是否适配其皮卡车型'],
        [/have ram boxes|need bed cover but.*ram boxes/i, '有Ram Boxes货箱，需确认后斗盖兼容性'],
        [/diesel.*dpf tank|dpf tank/i, '柴油版有DPF油箱，需确认兼容性'],
        [/with air ride/i, '空气悬挂车型，需确认兼容性'],
        [/extended for lift/i, '升高改装版，需确认适配'],
        [/for handicap wife/i, '残障人士辅助上车需求，有社会价值'],
        [/needs to work with ground effects/i, '需兼容车身包围/地台包围'],
        [/foot operated.*(door|slide)/i, '需兼容电动侧滑门感应装置'],
        [/not see( a|ing)(.*?) for(.*?) wrangler/i, '惊讶Jeep牧马人竟无适配电动踏板'],
        [/running boards please/i, '强烈希望开发该车型电动踏板'],
        [/something that fix/i, '询问是否有能适配的产品'],
        [/did (not|no) see this year/i, '询问该年份车型是否有适配产品'],
        [/doesn'?t show.*(up|for)/i, '官网上未覆盖该年份车型'],
        [/would be great/i, '希望为该车型开发此产品'],
        [/years.*(old|too)/i, '年份较老，询问是否有适配方案'],
        [/6'?.*?8".*bed|8 foot bed|long bed/i, '长货箱版本，需确认适配'],

// 车型热度弹窗：当前品类∩该车型 的年份占比 + 近期热度
function pd(s) {
  if(!s) return null;
  s = String(s).trim();
  let m = s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  if(/^\d+(\.\d+)?$/.test(s)) {
    const d = new Date(Date.UTC(1899,11,30));
    d.setUTCDate(d.getUTCDate()+Math.floor(parseFloat(s)));
    return d;
  }
  return null;
}
function showTrend(mk, mo, cat) {
  const mok = nm(mo).toLowerCase();
  const rows = vd.filter(v =>
    (!cat || (v.cat||'').split('\n').includes(cat)) &&
    (v.make||'').toLowerCase()===mk.toLowerCase() &&
    nm(v.model).toLowerCase()===mok
  );
  const cnt = {}, dates = [];
  rows.forEach(v => {
    const y = v.year || '未知';
    cnt[y] = (cnt[y]||0) + 1;
    const d = pd(v.date);
    if (d) dates.push(d);
  });
  const total = rows.length, tot = total || 1;
  const years = Object.entries(cnt).map(([y,c])=>({year:y,count:c,pct:Math.round(c/tot*100)})).sort((a,b)=>b.count-a.count);
  const now = new Date();
  const ago = (n) => new Date(now.getTime() - n*86400000);
  const r14 = dates.filter(d=>d>=ago(14)).length;
  const p14 = dates.filter(d=>d>=ago(28)&&d<ago(14)).length;
  const r7 = dates.filter(d=>d>=ago(7)).length;
  const p7 = dates.filter(d=>d>=ago(14)&&d<ago(7)).length;
  const spike = p14 ? (r14/p14).toFixed(1) : (r14 || 0);
  const growth = p7 ? (r7/p7).toFixed(1) : (r7 || 0);
  const maxY = Math.max(1, ...years.map(y=>y.count));
  const top = years[0], sec = years[1];
  let summary = '';
  if (top) {
    let s = '集中在'+top.year+'款('+top.pct+'%)';
    if (sec) s += '，其次'+sec.year+'款';
    summary = '<div class="text-[.6rem] text-gray-400 mt-2">📅 年份：'+s+'</div>';
  }
  document.getElementById('modT').textContent = '🔥 ' + mk + ' ' + mo;
  document.getElementById('modB').innerHTML = `
    <div class="flex gap-3 text-[.55rem] text-gray-500 mb-2">
      <span>14天: <span class="text-yellow-400 font-semibold">${r14}</span> 条</span>
      <span>飙升: <span class="text-orange-400 font-semibold">${spike}x</span></span>
      <span>环比: <span class="text-green-400 font-semibold">${growth}x</span></span>
      <span>总计: ${total} 条</span>
    </div>
    ${summary}
    ${years.length?`
    <div class="text-[.55rem] font-semibold text-gray-400 mt-2 mb-1">📅 年份分布</div>
    <div class="flex flex-col gap-1">${years.map(y=>`
      <div class="flex items-center gap-2 text-[.6rem]">
        <span class="w-10 text-right font-medium">${y.year}款</span>
        <div class="bt flex-1"><div class="bf" style="width:${(y.count/maxY*100).toFixed(0)}%;background:#3b82f6">${y.count}</div></div>
        <span class="w-6 text-right text-[.5rem] text-gray-500">${y.pct}%</span>
      </div>`).join('')}</div>`:'<div class="text-[.58rem] text-gray-600 mt-2">暂无年份数据</div>'}
    <div class="text-[.5rem] text-gray-600 mt-3">数据截止: ${D.updated_at||'-'}</div>`;
  document.getElementById('mod').classList.add('show');
}

    '电动踏板':'🇺🇸 Hummer H2/Escalade等老款全尺寸SUV改装圈需求集中：客户愿自装支架，可卖裸板+电机+线束 DIY 套件，或在改装论坛（H2 fanatics）种草开发专用适配支架',
  };
  // 按具体产品覆盖个别项建议（避免同类产品共用同一段建议）
  const PDS={
    'Shoe cleaning spot in running boards':'🇺🇸 主打户外/泥地/雨雪场景（越野、工地、农场），在电动踏板上做可拆卸鞋底清洁刷条属差异化创新，现有 AMP/GORhino 等竞品均无此功能，可形成区隔；刷条为耗材可带动长期复购，适合作为选装配件或面向 DIY/改装市场切入',
  };
  const suggest = PDS[p.title] || DS[p.cat] || '';
  document.getElementById('modT').textContent = `💡 ${p.title}`;
  document.getElementById('modB').innerHTML = `
    <div style="margin-bottom:10px;display:flex;gap:4px;flex-wrap:wrap">
      <div class="badge b-new">${p.cat}</div>
      ${p.exclusive===true?`<div class="badge" style="background:rgba(139,92,246,.15);color:#c084fc">🔒 独家创意需求</div>`:''}
    </div>
    ${suggest?`<div style="margin-bottom:10px;padding:6px 8px;background:rgba(99,102,241,.08);border-radius:4px;border:1px solid rgba(99,102,241,.15)">
      <div style="font-size:.55rem;font-weight:600;color:#a5b4fc;margin-bottom:3px">💡 NA市场开发建议</div>
      <div style="font-size:.64rem;line-height:1.6;color:#c7d2fe">${suggest}</div>
    </div>`:''}
    <div style="margin-bottom:10px">
      <div style="font-size:.55rem;font-weight:600;color:var(--tm);text-transform:uppercase;margin-bottom:4px">📝 客户原文 (EN)</div>
      <div style="font-size:.66rem;line-height:1.6;color:var(--text);padding:6px 8px;background:var(--bg);border-radius:4px;border:1px solid var(--border)">${orig}</div>
    </div>
    <div>
      <div style="font-size:.55rem;font-weight:600;color:var(--tm);text-transform:uppercase;margin-bottom:4px">🌐 中文译文</div>
      <div style="font-size:.66rem;line-height:1.6;color:#fcd34d;padding:6px 8px;background:rgba(245,158,11,.06);border-radius:4px;border:1px solid rgba(245,158,11,.15)">${trans}</div>
    </div>
  `;
  document.getElementById('mod').classList.add('show');
}

function cm() { document.getElementById('mod').classList.remove('show'); }
ld();
</script>
